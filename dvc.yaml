stages:
  data_ingestion:
    cmd: python src/data_ingestion.py
    deps:
      - src/data_ingestion.py
      - experiments/email.csv
    outs:
      - data/raw/train_data.csv
      - data/raw/test_data.csv
  data_preprocessing:
    cmd: python src/data_preprocessing.py
    deps:
      - src/data_preprocessing.py
      - data/raw/train_data.csv
      - data/raw/test_data.csv
    outs:
      - data/interim/train_processed_data.csv
      - data/interim/test_processed_data.csv
  feature_engineerning:
    cmd: python src/feature_engineerning.py
    deps:
      - src/feature_engineerning.py
      - data/interim/train_processed_data.csv
      - data/interim/test_processed_data.csv
    outs:
      - data/processed/train_tfidf.csv
      - data/processed/test_tfidf.csv
  model_training:
    cmd: python src/model_training.py
    deps:
      - src/model_training.py
      - data/processed/train_tfidf.csv
      - data/processed/test_tfidf.csv
    outs:
      - models/model.pkl
  model_evaluation:
    cmd: python src/model_evluation.py
    deps:
      - src/model_evluation.py
      - models/model.pkl
      - data/processed/test_tfidf.csv
    metrics:
      - models/metrics.json:
          cache: false

